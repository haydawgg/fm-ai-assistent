spring.application.name=fm-ai-assistent
server.port=8080
# In-app chat and MCP tools run locally; do not expose this UI to the network by default.
server.address=127.0.0.1
logging.file.name=${user.home}/.fm-ai-assistent/app.log
logging.level.com.github.fmaiassistent=INFO
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true

spring.ai.model.chat=none
spring.ai.mcp.server.name=fm-ai-assistent
spring.ai.mcp.server.version=${project.version:0.4.0-SNAPSHOT}
# Stateless Streamable HTTP for in-app chat tools and optional MCP clients.
spring.ai.mcp.server.protocol=stateless
spring.ai.mcp.server.instructions=Call fm26_status only if you do not know whether RAM is loaded. Do not narrate retries. For first-team buys call fm26_transfer_shortlist with managingClub, position and the user's constraints. For bargains call fm26_moneyball_shortlist. For external youth call fm26_wonderkid_shortlist; for in-house youth call fm26_academy — together on U19 questions. Do not invent a high minPotentialAbility. If returned is 0, follow empty_hint once then answer; do not keep calling the same tool. Use fm26_find_players only after one empty shortlist. Use fm26_get_player_details only for finalists. asking_price=null is unknown, not free; a price cap drops unknown fees. Money is raw pounds. Sales: fm26_sell_shortlist. Live tactic: fm26_current_tactic. First XI: fm26_best_xi. To refresh the snapshot call fm26_load_from_ram.

# Optional FM26 tactic context. FMF tactic data is decrypted and decoded locally.
app.ai.tactic-context.ocr-executable=tesseract
app.ai.tactic-context.ocr-timeout=30s
app.ai.tactic-context.max-file-size=20MB
app.ai.tactic-context.max-context-characters=16000
