spring.application.name=fm-ai-assistent
server.port=8080
# In-app chat and MCP tools run locally; do not expose this UI to the network by default.
server.address=127.0.0.1
# The UI and MCP endpoints are unauthenticated. Non-loopback binding requires an explicit opt-in.
app.network.allow-unauthenticated=false
# Development-only fixture data for UI work. Never enable this for a live FM26 snapshot.
app.ui.demo-data=false
logging.file.name=${user.home}/.fm-ai-assistent/app.log
logging.level.com.github.fmaiassistent=INFO
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
vaadin.usageStatistics.enabled=false
# Tomcat's JMX metrics binder is not compatible with native-image platform MXBeans;
# application health and UI functionality do not depend on this optional binder.
spring.autoconfigure.exclude=org.springframework.boot.tomcat.autoconfigure.metrics.TomcatMetricsAutoConfiguration
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true

spring.ai.model.chat=none
spring.ai.mcp.server.name=fm-ai-assistent
spring.ai.mcp.server.version=${project.version:0.4.0-SNAPSHOT}
# Stateless Streamable HTTP for in-app chat tools and optional MCP clients.
spring.ai.mcp.server.protocol=stateless
spring.ai.mcp.server.instructions=Call fm26_status only if you do not know whether RAM is loaded. Do not narrate retries. Use the session club name. For first-team buys call fm26_transfer_shortlist. For bargains call fm26_moneyball_shortlist — never for U21 wonderkids. For external youth call fm26_wonderkid_shortlist; for in-house youth call fm26_academy (B/U21 sides included) together. Do not invent a high minPotentialAbility or pass maxWeeklySalary. If returned is 0, follow empty_hint once then answer. Use fm26_find_players only after one empty shortlist and never with askingPriceMax. Current-season player statistics are all-competition totals; null means unknown, not zero. Performance filters exclude unknown statistics, and competition-level breakdowns are not included. Use fm26_get_player_details only for finalists. asking_price=null is unknown, not free. Money is raw pounds. Sales: fm26_sell_shortlist. Live tactic: fm26_current_tactic. First XI: fm26_best_xi. To refresh the snapshot call fm26_load_from_ram, then check fm26_status for its job progress and final result.

# Optional FM26 tactic context. FMF tactic data is decrypted and decoded locally.
app.ai.tactic-context.ocr-executable=tesseract
app.ai.tactic-context.ocr-timeout=30s
app.ai.tactic-context.max-file-size=20MB
app.ai.tactic-context.max-context-characters=16000
