spring.application.name=fm-ai-assistent
server.port=8080
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

spring.jpa.show-sql=false

spring.ai.mcp.server.name=fm-ai-assistent
spring.ai.mcp.server.version=${project.version:0.1.0-SNAPSHOT}
spring.ai.mcp.server.protocol=streamable
# Keep-alive forces the SSE GET stream to flush headers immediately; without it,
# clients (e.g. Antigravity) open the stream and wait forever for a response.
spring.ai.mcp.server.streamable-http.keep-alive-interval=1s
spring.ai.mcp.server.instructions=For recruitment advice, call fm26_transfer_shortlist first with managingClub, position and explicit user constraints. Its compact ranked response already includes club finances, current position options, affordability, estimated willingness and optional role fit. Do not call fm26_find_players, fm26_get_club_context or fm26_get_player_details first. Use fm26_get_player_details only for final candidates that need full attributes. Treat asking_price=null as unknown, not free, and willingness as an estimate. Money values are raw pounds. For value-oriented recruitment (best cheap signings, moneyball), call fm26_moneyball_shortlist instead: it ranks candidates by signing_rating (0-100), a composite of current ability, age-adjusted potential and transfer value (fee plus 3 years of wages against the market median), with deal_tier labelling the value component. Prefer fm26_moneyball_shortlist when the user wants bargains or value for money; prefer fm26_transfer_shortlist when role or tactical fit is the priority.
