spring.application.name=fm-ai-assistent
server.port=8080
# The embedded local agents can execute tools; do not expose this UI to the network by default.
server.address=127.0.0.1
logging.file.name=${user.home}/.fm-ai-assistent/app.log
logging.level.com.github.fmaiassistent=INFO
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true

spring.ai.model.chat=none
spring.autoconfigure.exclude=org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
spring.ai.mcp.server.name=fm-ai-assistent
spring.ai.mcp.server.version=${project.version:0.1.0-SNAPSHOT}
# Stateless Streamable HTTP is compatible with both Codex and Antigravity's local MCP clients.
spring.ai.mcp.server.protocol=stateless
spring.ai.mcp.server.instructions=Call fm26_status if you do not know whether RAM data is loaded. For recruitment, call fm26_transfer_shortlist first with managingClub, position and explicit user constraints. Do not call fm26_find_players, fm26_get_club_context or fm26_get_player_details first. Use fm26_get_player_details only for final candidates. Treat asking_price=null as unknown, not free. Money values are raw pounds. For bargains call fm26_moneyball_shortlist. For young talents call fm26_wonderkid_shortlist. For sales or squad trimming call fm26_sell_shortlist. For two clubs call fm26_compare_squads. For two players call fm26_compare_players. For the live tactic call fm26_current_tactic. For a first XI call fm26_best_xi; omit tacticSlots to use the RAM formation. Prefer fm26_find_players summaries; set details=true only when needed. To refresh the snapshot call fm26_load_from_ram.

# Uses the locally installed and authenticated Codex CLI. No API key is read or stored.
app.codex.enabled=true
app.codex.executable=codex
app.codex.working-directory=.
app.codex.startup-timeout=20s
app.codex.request-timeout=20s
app.codex.shutdown-timeout=5s

# Uses the locally installed and authenticated Antigravity CLI. No Google credentials are read or stored.
app.ai.antigravity.enabled=true
app.ai.antigravity.executable=agy
app.ai.antigravity.working-directory=.
app.ai.antigravity.print-timeout=15m
app.ai.antigravity.shutdown-timeout=5s

# GitHub Copilot CLI integration. Uses local `copilot login` credentials and CLI MCP config.
app.ai.copilot.enabled=true
app.ai.copilot.executable=copilot
app.ai.copilot.working-directory=.
app.ai.copilot.startup-timeout=30s
app.ai.copilot.shutdown-timeout=8s
app.ai.copilot.permission-timeout=5m

# Optional FM26 tactic context. FMF tactic data is decrypted and decoded locally.
app.ai.tactic-context.ocr-executable=tesseract
app.ai.tactic-context.ocr-timeout=30s
app.ai.tactic-context.max-file-size=20MB
app.ai.tactic-context.max-context-characters=16000
