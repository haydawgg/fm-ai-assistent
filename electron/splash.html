<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>FM AI Assistent</title>
<style>
  html, body { height: 100%; margin: 0; background: #0f172a; color: #e2e8f0; font-family: system-ui, sans-serif; }
  body { display: flex; align-items: center; justify-content: center; }
  .wrap { text-align: center; }
  .logo { font-size: 42px; font-weight: 700; color: #22d399; letter-spacing: 1px; }
  .status { margin-top: 16px; font-size: 14px; color: #94a3b8; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #22d399; margin-right: 8px; animation: pulse 1.2s infinite; vertical-align: middle; }
  @keyframes pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">FM AI Assistent</div>
    <div class="status"><span class="dot"></span>Starting Java backend&hellip;</div>
  </div>
</body>
</html>
