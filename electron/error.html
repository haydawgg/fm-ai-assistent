<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>FM AI Assistent - Error</title>
<style>
  html, body { height: 100%; margin: 0; background: #0f172a; color: #e2e8f0; font-family: system-ui, sans-serif; }
  body { display: flex; align-items: center; justify-content: center; }
  .wrap { max-width: 560px; text-align: center; padding: 24px; }
  h1 { font-size: 22px; color: #f87171; }
  p { font-size: 14px; line-height: 1.6; color: #94a3b8; }
  code { background: #1e293b; padding: 2px 6px; border-radius: 4px; color: #22d399; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Could not start FM AI Assistent</h1>
    <p id="message">Unknown error.</p>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    document.getElementById('message').textContent = params.get('message') || 'Unknown error.';
  </script>
</body>
</html>
